[project]
name = "lab_1"
version = "0.1.0"
description = "CLI-калькулятор и конвертер"
requires-python = ">=3.12"
dependencies = [ 
    "pytest>=8.4.2",
    "ruff>=0.16.9",
    "requests>=2.31",
    "rich>=13.0",
]

[tool.setuptools]
packages = ["toolkit"]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_-py"
python_classes = "Test"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [ 
    "slow: marks tests as slow", 
    "integration: marks tests as integration tests",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.9",
    "mypy>=1.10",
]